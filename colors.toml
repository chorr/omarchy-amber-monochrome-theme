# Retro CRT amber monochrome palette.
# Classic amber phosphor screen aesthetic:
# - Deep warm-black background (old CRT glass)
# - Main text in soft glowing amber (#c9a36a)
# - Single punchy accent (#e68e0d) used for bright highlights, selections, cursor glow
# Everything stays in the black → dark amber-brown → golden → bright amber family.
# No cool grays or competing hues.

color0  = "#1a120c"   # deep warm black
color1  = "#7a4a28"   # dim amber-brown (semantic red)
color2  = "#c99a4e"   # golden amber
color3  = "#6b4630"   # dark warm brown
color4  = "#e68e0d"   # accent (bright phosphor highlight)
color5  = "#8a5a3a"   # muted warm brown
color6  = "#a08050"   # warm amber-gray
color7  = "#c9a36a"   # main phosphor text
color8  = "#251a12"   # darker warm black
color9  = "#9a5c35"   # brighter dim amber-brown
color10 = "#e8b060"   # light golden
color11 = "#8f6640"   # mid warm brown
color12 = "#f5a630"   # bright amber (accent variant)
color13 = "#a07048"   # warm brown
color14 = "#d8b880"   # bright warm text
color15 = "#f8e8c0"   # very bright phosphor
