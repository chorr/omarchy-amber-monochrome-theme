# Amber Monochrome theme
# Provides Hyprland overrides so that the primary/accent color for borders
# uses the theme accent (#e68e0d), same as Matte Black's accent behavior.
# This overrides the default looknfeel which has a cyan/blue-ish border.
#
# Only use valid options: col.active_border and col.inactive_border.
# Other border_* options do not exist in current Hyprland and cause config errors.

general {
    col.active_border = 0xffe68e0d 0xffe68e0d 45deg
    col.inactive_border = 0xaa222222
}
